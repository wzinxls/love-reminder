<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Напоминание ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #f7d2e4;
      background-image: 
        radial-gradient(#eeadc9 1.5px, transparent 1.5px),
        radial-gradient(#eeadc9 1.5px, #f7d2e4 1.5px);
      background-size: 30px 30px;
      background-position: 0 0, 15px 15px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* Floating Background Items Container */
    #floating-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -60px;
      will-change: transform, opacity;
      animation: floatUp linear infinite;
      opacity: 0.85;
      filter: drop-shadow(0 2px 4px rgba(180, 100, 140, 0.25));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.8);
        opacity: 0;
      }
      10% {
        opacity: 0.85;
      }
      85% {
        opacity: 0.85;
      }
      100% {
        transform: translateY(-115vh) rotate(360deg) scale(1.1);
        opacity: 0;
      }
    }

    /* Retro Windows 95 / Aesthetic Window */
    .window-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .retro-window {
      background: #c394ae;
      border: 3px solid #3d081e;
      box-shadow: 
        inset 2px 2px 0px #e8bed6,
        inset -2px -2px 0px #703350,
        6px 6px 0px rgba(61, 8, 30, 0.35);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Window Header */
    .window-header {
      background: #5d1633;
      padding: 6px 8px 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3d081e;
    }

    .window-title {
      color: #ffffff;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0px #2a0312;
      font-family: 'Segoe UI', 'Comfortaa', Tahoma, sans-serif;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      background: #c394ae;
      border-top: 2px solid #f2d4e4;
      border-left: 2px solid #f2d4e4;
      border-right: 2px solid #571e38;
      border-bottom: 2px solid #571e38;
      box-shadow: 1px 1px 0px #3d081e;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 11px;
      color: #5d1633;
      font-weight: bold;
      transition: all 0.1s ease;
      line-height: 1;
    }

    .close-btn:active {
      border-top: 2px solid #571e38;
      border-left: 2px solid #571e38;
      border-right: 2px solid #f2d4e4;
      border-bottom: 2px solid #f2d4e4;
      transform: translate(1px, 1px);
    }

    /* Window Body */
    .window-body {
      padding: 32px 24px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 28px;
    }

    .heart-icon-wrapper {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-icon {
      width: 72px;
      height: auto;
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      animation: pulse 1.8s ease-in-out infinite;
      filter: drop-shadow(2px 2px 0px rgba(61, 8, 30, 0.2));
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    .main-message {
      color: #1a050f;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.3px;
      text-align: left;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: opacity 0.25s ease;
    }

    /* OK Button */
    .button-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .retro-btn {
      min-width: 105px;
      padding: 6px 24px;
      background: #c394ae;
      border-top: 2px solid #f2d4e4;
      border-left: 2px solid #f2d4e4;
      border-right: 2px solid #571e38;
      border-bottom: 2px solid #571e38;
      box-shadow: 2px 2px 0px #3d081e;
      outline: 1px dotted rgba(61, 8, 30, 0.35);
      outline-offset: -5px;
      color: #1a050f;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.08s ease;
      text-align: center;
    }

    .retro-btn:hover {
      background: #caa1b6;
    }

    .retro-btn:active {
      border-top: 2px solid #571e38;
      border-left: 2px solid #571e38;
      border-right: 2px solid #f2d4e4;
      border-bottom: 2px solid #f2d4e4;
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #3d081e;
    }

    /* Confetti Particle */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(1.4);
        opacity: 0;
      }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .retro-window {
        border-width: 2px;
      }
      .window-header {
        padding: 5px 6px 5px 10px;
      }
      .window-title {
        font-size: 17px;
      }
      .close-btn {
        width: 22px;
        height: 22px;
        font-size: 10px;
      }
      .window-body {
        padding: 24px 16px 22px 16px;
      }
      .content-row {
        gap: 14px;
        margin-bottom: 22px;
      }
      .heart-icon {
        width: 58px;
      }
      .main-message {
        font-size: 20px;
      }
      .retro-btn {
        min-width: 95px;
        font-size: 18px;
        padding: 5px 20px;
      }
    }
  </style>
</head>

          <div class="main-message" id="messageText">
            Я люблю тебя

        </div>
        <div class="button-container">
          <button class="retro-btn" id="okBtn">ok</button>
        </div>

  <script>
    // Pixel Bear SVG
    const bearSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' width='32' height='32'><path fill='%23915843' d='M2 1h3v3H2zm9 0h3v3h-3zM2 4h12v9H2z'/><path fill='%23fca5b7' d='M3 2h1v1H3zm9 0h1v1h-1z'/><path fill='%23b27b64' d='M3 5h10v7H3z'/><path fill='%232b130e' d='M4 6h2v2H4zm6 0h2v2h-2zm-3 2h2v1H7z'/><path fill='%23ffccd5' d='M3 8h1v1H3zm9 0h1v1h-1z'/><path fill='%23fed9e0' d='M6 8h4v3H6z'/></svg>`;
    const bearSvgUri = "data:image/svg+xml;utf8," + encodeURIComponent(bearSvg);

    // Pixel Heart SVG
    const heartSvg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' width='28' height='28'><path fill='%235d1633' d='M3 1h3v2H3zm7 0h3v2h-3zM1 3h2v2H1zm13 0h2v2h-2zM0 5h1v4H0zm15 0h1v4h-1zM1 9h2v2H1zm13 0h2v2h-2zM3 11h2v2H3zm8 0h2v2h-2zM5 13h2v2H5zm4 0h2v2H9zm-2 2h2v1H7z'/><path fill='%23e66099' d='M3 3h3v2H3zm7 0h3v2h-3zM1 5h14v4H1zm2 4h10v2H3zm2 2h6v2H5zm2 2h2v1H7z'/><path fill='%23ffffff' d='M3 4h2v2H3zm1 2h2v1H4z'/></svg>`;
    const heartSvgUri = "data:image/svg+xml;utf8," + encodeURIComponent(heartSvg);

    const bgContainer = document.getElementById('floating-bg');

    // Spawn floating background items (hearts & bears)
    function spawnFloatItem() {
      const item = document.createElement('div');
      item.className = 'float-item';
      
      const isBear = Math.random() > 0.55;
      const img = document.createElement('img');
      img.src = isBear ? bearSvgUri : heartSvgUri;
      img.style.width = isBear ? (Math.random() * 14 + 28) + 'px' : (Math.random() * 12 + 20) + 'px';
      img.style.imageRendering = 'pixelated';
      item.appendChild(img);

      item.style.left = Math.random() * 92 + 'vw';
      const duration = Math.random() * 5 + 7; // 7 to 12s
      item.style.animationDuration = duration + 's';
      item.style.animationDelay = (Math.random() * 0.4) + 's';

      bgContainer.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, duration * 1000 + 1000);
    }

    // Populate initial items
    for (let i = 0; i < 16; i++) {
      setTimeout(spawnFloatItem, i * 400);
    }
    setInterval(spawnFloatItem, 800);

    // Interactive button logic
    const okBtn = document.getElementById('okBtn');
    const messageText = document.getElementById('messageText');
    const windowBox = document.getElementById('windowBox');
    const closeBtn = document.getElementById('closeBtn');
    const mainHeart = document.getElementById('mainHeart');

    let state = 0;
    const heartImgSrc = mainHeart.src;

    function createBurst(x, y) {
      for (let i = 0; i < 26; i++) {
        const particle = document.createElement('div');
        particle.className = 'sparkle-particle';
        
        const img = document.createElement('img');
        img.src = Math.random() > 0.4 ? heartImgSrc : heartSvgUri;
        img.style.width = (Math.random() * 16 + 14) + 'px';
        img.style.imageRendering = 'pixelated';
        particle.appendChild(img);

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 150 + 70;
        const dx = Math.cos(angle) * dist + 'px';
        const dy = Math.sin(angle) * dist + 'px';

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    okBtn.addEventListener('click', (e) => {
      const rect = okBtn.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;

      createBurst(clickX, clickY);

      if (state === 0) {
        messageText.style.opacity = '0';
        setTimeout(() => {
          messageText.innerHTML = 'Ты у меня самая лучшая девочка на свете <img src="' + heartImgSrc + '" style="width:24px; vertical-align:middle; image-rendering:pixelated; margin-left:3px; display:inline-block;">';
          messageText.style.fontSize = '21px';
          messageText.style.opacity = '1';
          okBtn.textContent = '❤️';
        }, 200);
        state = 1;
      } else if (state === 1) {
        windowBox.style.transform = 'scale(1.06)';
        setTimeout(() => {
          windowBox.style.transform = 'scale(1)';
        }, 150);
      }
    });

    closeBtn.addEventListener('click', () => {
      alert('Нет-нет-нет, это напоминание закрыть нельзя! Только "ok" ❤️');
    });
  </script>
</body>
