<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Напоминание ❤️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Comfortaa:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: #f7d2e4;
      background-image: 
        radial-gradient(#e9a1c1 1.5px, transparent 1.5px),
        radial-gradient(#e9a1c1 1.5px, #f7d2e4 1.5px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    /* Static background bows and hearts */
    #static-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .static-decor {
      position: absolute;
      opacity: 0.6;
      filter: drop-shadow(0 2px 5px rgba(180, 90, 130, 0.2));
      transition: transform 0.4s ease;
      image-rendering: pixelated;
    }

    /* Floating uploaded characters layer */
    #floating-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 2;
      overflow: hidden;
    }

    .float-item {
      position: absolute;
      bottom: -90px;
      will-change: transform, opacity;
      animation: floatUp linear infinite;
      opacity: 0.88;
      filter: drop-shadow(0 4px 8px rgba(140, 60, 100, 0.25));
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg) scale(0.85);
        opacity: 0;
      }
      10% {
        opacity: 0.88;
      }
      85% {
        opacity: 0.88;
      }
      100% {
        transform: translateY(-120vh) rotate(var(--rot, 15deg)) scale(1.05);
        opacity: 0;
      }
    }

    /* Retro Windows 95 / Aesthetic Window */
    .window-container {
      position: relative;
      z-index: 10;
      width: 90%;
      max-width: 440px;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .retro-window {
      background: #c394ae;
      border: 3px solid #3d081e;
      box-shadow: 
        inset 2px 2px 0px #e8bed6,
        inset -2px -2px 0px #703350,
        6px 6px 0px rgba(61, 8, 30, 0.35);
      border-radius: 2px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Window Header */
    .window-header {
      background: #5d1633;
      padding: 6px 8px 6px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #3d081e;
    }

    .window-title {
      color: #ffffff;
      font-size: 19px;
      font-weight: 500;
      letter-spacing: 0.5px;
      text-shadow: 1px 1px 0px #2a0312;
      font-family: 'Segoe UI', 'Comfortaa', Tahoma, sans-serif;
    }

    .close-btn {
      width: 24px;
      height: 24px;
      background: #c394ae;
      border-top: 2px solid #f2d4e4;
      border-left: 2px solid #f2d4e4;
      border-right: 2px solid #571e38;
      border-bottom: 2px solid #571e38;
      box-shadow: 1px 1px 0px #3d081e;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-family: 'Press Start 2P', monospace, sans-serif;
      font-size: 11px;
      color: #5d1633;
      font-weight: bold;
      transition: all 0.1s ease;
      line-height: 1;
    }

    .close-btn:active {
      border-top: 2px solid #571e38;
      border-left: 2px solid #571e38;
      border-right: 2px solid #f2d4e4;
      border-bottom: 2px solid #f2d4e4;
      transform: translate(1px, 1px);
    }

    /* Window Body */
    .window-body {
      padding: 32px 24px 28px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .content-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
      margin-bottom: 28px;
    }

    .heart-icon-wrapper {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .heart-icon {
      width: 72px;
      height: auto;
      image-rendering: pixelated;
      animation: pulse 1.8s ease-in-out infinite;
      filter: drop-shadow(2px 2px 0px rgba(61, 8, 30, 0.2));
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.08);
      }
    }

    .main-message {
      color: #1a050f;
      font-size: 26px;
      font-weight: 500;
      line-height: 1.35;
      letter-spacing: -0.3px;
      text-align: left;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: opacity 0.25s ease;
    }

    /* OK Button */
    .button-container {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .retro-btn {
      min-width: 105px;
      padding: 6px 24px;
      background: #c394ae;
      border-top: 2px solid #f2d4e4;
      border-left: 2px solid #f2d4e4;
      border-right: 2px solid #571e38;
      border-bottom: 2px solid #571e38;
      box-shadow: 2px 2px 0px #3d081e;
      outline: 1px dotted rgba(61, 8, 30, 0.35);
      outline-offset: -5px;
      color: #1a050f;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      font-size: 20px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.08s ease;
      text-align: center;
    }

    .retro-btn:hover {
      background: #caa1b6;
    }

    .retro-btn:active {
      border-top: 2px solid #571e38;
      border-left: 2px solid #571e38;
      border-right: 2px solid #f2d4e4;
      border-bottom: 2px solid #f2d4e4;
      transform: translate(2px, 2px);
      box-shadow: 0px 0px 0px #3d081e;
    }

    /* Confetti Particle */
    .sparkle-particle {
      position: absolute;
      pointer-events: none;
      z-index: 100;
      animation: explode 0.8s ease-out forwards;
    }

    @keyframes explode {
      0% {
        transform: translate(0, 0) scale(0.6);
        opacity: 1;
      }
      100% {
        transform: translate(var(--dx), var(--dy)) scale(1.4);
        opacity: 0;
      }
    }

    /* Responsive Design */
    @media (max-width: 480px) {
      .retro-window {
        border-width: 2px;
      }
      .window-header {
        padding: 5px 6px 5px 10px;
      }
      .window-title {
        font-size: 17px;
      }
      .close-btn {
        width: 22px;
        height: 22px;
        font-size: 10px;
      }
      .window-body {
        padding: 24px 16px 22px 16px;
      }
      .content-row {
        gap: 14px;
        margin-bottom: 22px;
      }
      .heart-icon {
        width: 58px;
      }
      .main-message {
        font-size: 20px;
      }
      .retro-btn {
        min-width: 95px;
        font-size: 18px;
        padding: 5px 20px;
      }
    }
  </style>
</head>

    };

    // 1. Generate Static Background (Pixel Bows & Hearts)
    const staticContainer = document.getElementById('static-bg');
    const staticItems = [
      // Top row
      { type: 'bow', top: '5%', left: '6%', size: 48, rot: -10 },
      { type: 'heart', top: '8%', left: '26%', size: 32, rot: 8 },
      { type: 'bow', top: '4%', left: '50%', size: 42, rot: 5 },
      { type: 'heart', top: '7%', left: '72%', size: 34, rot: -12 },
      { type: 'bow', top: '5%', left: '88%', size: 46, rot: 15 },

      // Middle sides
      { type: 'heart', top: '35%', left: '4%', size: 36, rot: -8 },
      { type: 'bow', top: '52%', left: '6%', size: 50, rot: 12 },
      { type: 'bow', top: '32%', left: '90%', size: 48, rot: -15 },
      { type: 'heart', top: '55%', left: '88%', size: 35, rot: 10 },

      // Bottom row
      { type: 'bow', top: '85%', left: '8%', size: 46, rot: -10 },
      { type: 'heart', top: '90%', left: '28%', size: 34, rot: 14 },
      { type: 'bow', top: '88%', left: '52%', size: 44, rot: -5 },
      { type: 'heart', top: '84%', left: '74%', size: 32, rot: -10 },
      { type: 'bow', top: '86%', left: '90%', size: 48, rot: 8 }
    ];

    staticItems.forEach(item => {
      const el = document.createElement('img');
      el.src = item.type === 'bow' ? ASSETS.bow : ASSETS.heart;
      el.className = 'static-decor';
      el.style.top = item.top;
      el.style.left = item.left;
      el.style.width = item.size + 'px';
      el.style.transform = `rotate(${item.rot}deg)`;
      staticContainer.appendChild(el);
    });

    // 2. Floating Uploaded Characters (Bear 1, Bear 2, Meme Guy, Cat Flower)
    const floatingPool = [
      { src: ASSETS.bear1, width: 62 },
      { src: ASSETS.bear2, width: 60 },
      { src: ASSETS.cat, width: 58 },
      { src: ASSETS.meme, width: 56 },
      { src: ASSETS.bow, width: 44 },
      { src: ASSETS.heart, width: 34 }
    ];

    const bgContainer = document.getElementById('floating-bg');

    function spawnFloatItem() {
      const item = document.createElement('div');
      item.className = 'float-item';
      
      const chosen = floatingPool[Math.floor(Math.random() * floatingPool.length)];
      const img = document.createElement('img');
      img.src = chosen.src;
      
      // Random scaling variance +-15%
      const scale = (Math.random() * 0.3 + 0.85);
      img.style.width = Math.round(chosen.width * scale) + 'px';
      img.style.imageRendering = 'pixelated';
      item.appendChild(img);

      item.style.left = Math.random() * 92 + 'vw';
      const duration = Math.random() * 6 + 8; // 8 to 14 seconds
      const rot = (Math.random() * 40 - 20) + 'deg';
      item.style.setProperty('--rot', rot);
      item.style.animationDuration = duration + 's';

      bgContainer.appendChild(item);

      setTimeout(() => {
        item.remove();
      }, duration * 1000 + 500);
    }

    // Spawn staggered initial items
    for (let i = 0; i < 12; i++) {
      setTimeout(spawnFloatItem, i * 600);
    }
    setInterval(spawnFloatItem, 1100);

    // 3. Interactive Window Actions
    const okBtn = document.getElementById('okBtn');
    const messageText = document.getElementById('messageText');
    const windowBox = document.getElementById('windowBox');
    const closeBtn = document.getElementById('closeBtn');

    let state = 0;

    function createBurst(x, y) {
      const burstAssets = [ASSETS.heart, ASSETS.bow, ASSETS.cat];
      for (let i = 0; i < 28; i++) {
        const particle = document.createElement('div');
        particle.className = 'sparkle-particle';
        
        const img = document.createElement('img');
        img.src = burstAssets[Math.floor(Math.random() * burstAssets.length)];
        img.style.width = (Math.random() * 16 + 16) + 'px';
        img.style.imageRendering = 'pixelated';
        particle.appendChild(img);

        const angle = Math.random() * Math.PI * 2;
        const dist = Math.random() * 150 + 70;
        const dx = Math.cos(angle) * dist + 'px';
        const dy = Math.sin(angle) * dist + 'px';

        particle.style.left = x + 'px';
        particle.style.top = y + 'px';
        particle.style.setProperty('--dx', dx);
        particle.style.setProperty('--dy', dy);

        document.body.appendChild(particle);
        setTimeout(() => particle.remove(), 800);
      }
    }

    okBtn.addEventListener('click', () => {
      const rect = okBtn.getBoundingClientRect();
      const clickX = rect.left + rect.width / 2;
      const clickY = rect.top + rect.height / 2;

      createBurst(clickX, clickY);

      if (state === 0) {
        messageText.style.opacity = '0';
        setTimeout(() => {
          messageText.innerHTML = 'Ты у меня самая лучшая девочка на свете <img src="' + ASSETS.heart + '" style="width:24px; vertical-align:middle; image-rendering:pixelated; margin-left:3px; display:inline-block;">';
          messageText.style.fontSize = '21px';
          messageText.style.opacity = '1';
          okBtn.textContent = '❤️';
        }, 200);
        state = 1;
      } else if (state === 1) {
        windowBox.style.transform = 'scale(1.06)';
        setTimeout(() => {
          windowBox.style.transform = 'scale(1)';
        }, 150);
      }
    });

    closeBtn.addEventListener('click', () => {
      alert('Нет-нет-нет, это напоминание закрыть нельзя! Только "ok" ❤️');
    });
  </script>
